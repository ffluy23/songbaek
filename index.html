<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<style>
@import url('https://cdn.jsdelivr.net/gh/MonadABXY/mona-font/web/mona.css');

@font-face {
    font-family: 'BoldRound';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2507-2@1.0/BoldDungGeunMo.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
}

:root {
    --accent: #5f8f7a;
    --accent-soft: #8fb3a3;
}

body {
    background-image: url("https://subtle-crimson-e3cjpehsmx.edgeone.app/%EC%A0%9C%EB%8B%88%EC%8A%A4%EB%A7%81%20%EB%B0%B0%EA%B2%BD.jpg");
    background-size: cover;      
    background-position: center; 
    background-repeat: no-repeat;
    background-attachment: fixed;
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: 'Mona12', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* iOS Safari background-attachment: fixed 버그 대응 */
@supports (-webkit-touch-callout: none) {
    body {
        background-attachment: scroll;
    }
}

/* 본체  */
.container {
    width: min(480px, calc(100vw - 32px));
    height: auto;
    padding: 22px;
    background: #2b2f33;
    border: 3px solid #1f2326;
    border-radius: 14px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.7), 4px 6px 0 #121417;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.title {
    font-family: 'BoldRound', sans-serif;
    font-size: 20px;
    letter-spacing: 1px;
    color: var(--accent);
}

.status {
    font-size: 11px;
    color: #9aa0a6;
}

/* 화면 */
.screen {
    height: clamp(200px, 35vw, 280px);
    background: #f4fbf7;
    border: 2px solid #cfd4da;
    border-radius: 6px;
    padding: 18px;
    padding-top: 30px;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.15);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center; 
}

/* 화면 상단 UI */
.screen-top {
    position: absolute;
    top: 6px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    color: #555;
}

/* CRT 느낌 */
.screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.03),
        rgba(0,0,0,0.03) 1px,
        transparent 1px,
        transparent 3px
    );
    pointer-events: none;
}

/* 배터리 */
.battery {
    width: 28px;
    height: 14px;
    border: 2px solid #999;
    border-radius: 3px;
    position: relative;
    padding: 2px;
    box-sizing: border-box;
}

.battery::after {
    content: '';
    position: absolute;
    right: -6px;
    top: 4px;
    width: 3px;
    height: 6px;
    background: #999;
    border-radius: 1px;
}

.battery-level {
    height: 100%;
    width: 70%;
    background: var(--accent);
    border-radius: 1px;
    animation: batteryBlink 2s infinite;
}

@keyframes batteryBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

/* 버튼 */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    flex: 1;
    grid-template-rows: 1fr 1fr;
}

.btn {
    display: flex;
    font-family: 'Mona12', sans-serif;
    flex-direction: column;
    height: 100%;
    align-items: center;
    justify-content: center;
    padding: 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    background: #e9ecef;
    border: 2px solid #ced4da;
    box-shadow: 3px 3px 0 #adb5bd;
    transition: 0.1s;
    color: #495057;
}

.btn svg {
    width: 34px;
    height: 34px;
    margin-bottom: 4px;
    fill: var(--accent);
}

.btn:hover {
    transform: translateY(-1px);
    background: #dee2e6;
}

.btn:active {
    transform: translateY(3px);
    box-shadow: 1px 1px 0 #868e96;
}

.footer {
    margin-top: 15px;
    font-size: 11px;
    text-align: center;
    color: #868e96;
    letter-spacing: 1px;
}

/* 노이즈 */
.noise {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background-image: url('https://www.transparenttextures.com/patterns/asfalt-light.png');
    opacity: 0.35;
    z-index: 100;
}

h2 { text-align: center; }

.login-box {
    display: flex;
    justify-content: center;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

input {
    font-family: 'Mona12', sans-serif;
    width: 60%;
    padding: 2%;
}

.btn#loginBtn {
    display: flex;
    width: 65%;
    font-family: 'Mona12', sans-serif;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 9px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    background: #e9ecef;
    border: 2px solid #ced4da;
    box-shadow: 2px 2px 0 #adb5bd;
    transition: 0.1s;
    color: #495057;
}

/* Centered icon */
.mail-wrapper {
    position: relative;
    animation: float 2s ease-in-out infinite;
    cursor: pointer;
}

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0); }
}

/* Badge */
.badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: red;
    color: white;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Modal background */
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
}

.modal.active {
    display: flex;
}

/* Modal box — 고정 높이 + 내부 스크롤 구조 */
.modal-content {
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    animation: pop 0.3s ease;
    width: min(420px, calc(100vw - 48px));
    max-height: min(560px, calc(100dvh - 80px));
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

@keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* 모달 상단 고정 (스킵 버튼) */
.modal-header {
    display: flex;
    justify-content: flex-end;
    padding: 16px 20px 0;
    flex-shrink: 0;
}

/* 스킵 버튼 */
.skip-btn {
    font-family: 'Mona12', sans-serif;
    font-size: 11px;
    color: #aaa;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    transition: color 0.2s;
}

.skip-btn:hover { color: #666; }

.skip-btn.hidden {
    visibility: hidden;
    pointer-events: none;
}

/* 스크롤 가능한 텍스트 영역 */
.modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px 8px;
    scrollbar-width: thin;
    scrollbar-color: #ccc transparent;
    -webkit-overflow-scrolling: touch; /* iOS 관성 스크롤 */
}

.modal-body::-webkit-scrollbar {
    width: 4px;
}

.modal-body::-webkit-scrollbar-track {
    background: transparent;
}

.modal-body::-webkit-scrollbar-thumb {
    background: #ccc;
    border-radius: 4px;
}

/* 타이핑 텍스트 */
#typewriter-text {
    width: 100%;
    white-space: pre-wrap;
    word-break: keep-all;
    font-family: 'Mona12', sans-serif;
    font-size: 13px;
    line-height: 1.85;
    color: #333;
}

/* 커서 깜빡임 */
.cursor {
    display: inline-block;
    width: 2px;
    height: 13px;
    background: #007f58;
    vertical-align: middle;
    margin-left: 1px;
    animation: blink 0.7s step-end infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

/* 하단 고정 (닫기 버튼) */
.modal-footer {
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    padding: 12px 20px 20px;
    box-shadow: 0 -6px 12px rgba(255,255,255,0.95);
}

.close-btn {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    background: #007f58;
    color: white;
    cursor: pointer;
    font-family: 'Mona12', sans-serif;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
}

.close-btn.visible {
    opacity: 1;
    pointer-events: auto;
}

/* ── 모바일 반응형 ── */
@media (max-width: 480px) {
    /* 본체가 화면을 꽉 채우지 않도록 여백 확보 */
    .container {
        padding: 16px;
    }

    /* 화면 높이 — 세로폰에서 너무 작아지지 않게 고정 */
    .screen {
        height: 220px;
    }

    /* 모달 — 화면 하단 시트처럼 */
    .modal {
        align-items: flex-end;
    }

    .modal-content {
        width: 100%;
        max-height: 75dvh;
        border-radius: 20px 20px 0 0;
        animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
        from { transform: translateY(100%); opacity: 0; }
        to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-header {
        padding: 14px 16px 0;
    }

    .modal-body {
        padding: 10px 16px 6px;
    }

    #typewriter-text {
        font-size: 12px;
    }

    .modal-footer {
        padding: 10px 16px 28px; /* 홈 인디케이터 여백 */
    }

    .close-btn {
        width: 100%;
        padding: 12px;
        font-size: 14px;
        border-radius: 10px;
    }
}
</style>
<body>
<div class="container">
  <div class="header">
    <div class="title">ZENITH RING</div>
  </div>
  <div class="screen">
    <div class="screen-top">
        <span>v1.0</span>
        <div class="status">ONLINE</div>
        <div class="battery">
            <div class="battery-level"></div>
        </div>
    </div>

    <div class="mail-wrapper" onclick="openModal()">
      <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24">
        <path fill="#007f58" d="M4 20q-.825 0-1.412-.587T2 18V6q0-.825.588-1.412T4 4h16q.825 0 1.413.588T22 6v12q0 .825-.587 1.413T20 20zm8-7L4 8v10h16V8zm0-2l8-5H4zM4 8V6v12z"/>
      </svg>
      <div class="badge" id="badge">1</div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <div class="modal-header">
          <button class="skip-btn" id="skipBtn" onclick="skipTyping()">스킵 ▶</button>
        </div>
        <div class="modal-body" id="modalBody">
          <div id="typewriter-text"><span class="cursor" id="cursor"></span></div>
        </div>
        <div class="modal-footer">
          <button class="close-btn" id="closeBtn" onclick="closeModal()">닫기</button>
        </div>
      </div>
    </div>
  </div>
  <div class="footer">Made by Sonnet with Ampharos</div>
</div>


<script>
  const MESSAGE = `To. 송백

요즘 세상에 손편지라니~ 참, 낭만적인데. 이런 건 박물관에 전시해야 하는 거 아닌가?
...농담이야, 농담.

편지, 잘 읽었어. 네가 고른 단어들이 참 마음에 들어서 말이야. 요즘은 다들 빠르게 말하고, 빠르게 잊어버리는데—
이렇게 시간을 들여서 마음을 건네는 건 생각보다 쉽지 않은 일이야. 그래서 더 귀하게 느껴졌어.

답장을 메일로 보내는 건... 음, 그냥 내 방식이라고 해둘까. 너무 서운해하진 마.
대신 다음에 네가 또 편지를 보내면, 그땐 나도 조금 더 고민해볼게.
종이 위에 쓰는 말은 아무래도 좀 더 신중해지니까.

배틀도 열심히 하고 있다면서. 음, 좋네. 너무 이기려고만 하지 말고, 가끔은 네 포켓몬들이 어떻게 움직이고 싶은지도 잘 봐줘.
의외로 걔네가 먼저 길을 알려줄 때가 있거든.

여기선 여전히 비슷하게 지내고 있어. 참고로 이 메일은 전설의전룡이 생산한 전설의전기로 쓰고 있다구. (농담이야)
블래키는 어쩐지 요즘 좀 더 활발해진 것 같아. 아무래도 아카데미에서 배틀이 재밌었나봐.

방학 끝나기 전까지 너무 바쁘게 굴지 말고— 가끔은 아무것도 안 하고 늘어져 있는 시간도 챙겨.
그런 시간이... 얼마 남지 않았을지도 모르지. (이것도 농담이야)

그럼 잘 지내고! 개학하면 만나자~

P.S. 내가 미인이라느니 하는 건— 음, 방학이라 좀 풀어졌나봐!? 개학 후에도 똑같이 말할 수 있으면, 그때 가서 진지하게 고민해볼게.
지금은 그냥... 귀여운 농담으로 받아둘게.

— 소넷`;

  const CHAR_DELAY = 28;

  let typingTimer = null;
  let isTypingDone = false;

  function openModal() {
    document.getElementById('modal').classList.add('active');

    const badge = document.getElementById('badge');
    if (badge) badge.style.display = 'none';

    startTyping();
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
    clearTimeout(typingTimer);
    isTypingDone = false;
  }

  function startTyping() {
    const textEl = document.getElementById('typewriter-text');
    const cursor = document.getElementById('cursor');
    const closeBtn = document.getElementById('closeBtn');
    const skipBtn = document.getElementById('skipBtn');
    const modalBody = document.getElementById('modalBody');

    // 초기화
    textEl.textContent = '';
    textEl.appendChild(cursor);
    cursor.classList.remove('hidden');
    closeBtn.classList.remove('visible');
    skipBtn.classList.remove('hidden');
    isTypingDone = false;
    modalBody.scrollTop = 0;

    let i = 0;

    function typeNext() {
      if (i >= MESSAGE.length) {
        finishTyping();
        return;
      }

      textEl.removeChild(cursor);
      textEl.insertAdjacentText('beforeend', MESSAGE[i]);
      textEl.appendChild(cursor);

      i++;

      // 타이핑 중 자동 스크롤 — 커서가 항상 보이도록
      modalBody.scrollTop = modalBody.scrollHeight;

      typingTimer = setTimeout(typeNext, CHAR_DELAY);
    }

    typeNext();
  }

  function finishTyping() {
    const cursor = document.getElementById('cursor');
    const closeBtn = document.getElementById('closeBtn');
    const skipBtn = document.getElementById('skipBtn');
    const textEl = document.getElementById('typewriter-text');

    isTypingDone = true;

    if (cursor.parentNode === textEl) textEl.removeChild(cursor);

    closeBtn.classList.add('visible');
    skipBtn.classList.add('hidden');
  }

  function skipTyping() {
    clearTimeout(typingTimer);

    const textEl = document.getElementById('typewriter-text');
    const cursor = document.getElementById('cursor');
    const modalBody = document.getElementById('modalBody');

    if (cursor.parentNode === textEl) textEl.removeChild(cursor);
    textEl.textContent = MESSAGE;

    // 스킵하면 맨 위로 — 처음부터 읽을 수 있게
    modalBody.scrollTop = 0;

    finishTyping();
  }

  // 바깥 클릭 시 닫기
  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
</script>

</body>
</html>
